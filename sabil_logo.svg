<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a472a" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Grain/wheat symbol - stylized -->
  <g transform="translate(100, 100)">
    <!-- Left grain stalks -->
    <line x1="-30" y1="20" x2="-25" y2="-30" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="20" x2="-18" y2="-35" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="20" x2="-8" y2="-35" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Center grain stalks -->
    <line x1="0" y1="25" x2="0" y2="-40" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="23" x2="8" y2="-38" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="23" x2="-8" y2="-38" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Right grain stalks -->
    <line x1="10" y1="20" x2="18" y2="-35" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="25" y2="-30" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="20" x2="32" y2="-28" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Grain heads -->
    <circle cx="-25" cy="-32" r="4" fill="#ffd700"/>
    <circle cx="-18" cy="-37" r="4" fill="#ffd700"/>
    <circle cx="-8" cy="-37" r="4" fill="#ffd700"/>
    <circle cx="0" cy="-42" r="5" fill="#ffd700"/>
    <circle cx="8" cy="-40" r="4" fill="#ffd700"/>
    <circle cx="18" cy="-37" r="4" fill="#ffd700"/>
    <circle cx="25" cy="-32" r="4" fill="#ffd700"/>
    <circle cx="32" cy="-30" r="4" fill="#ffd700"/>
    
    <!-- Silo base outline -->
    <rect x="-20" y="15" width="40" height="30" fill="none" stroke="#d4af37" stroke-width="2" rx="3"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d4af37">SABIL</text>
  <text x="100" y="188" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d4af37">GROUP</text>
</svg>